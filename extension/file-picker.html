<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Seleccionar Planilla Excel</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f1117;
        color: #e2e8f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 24px 32px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      }
      h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #f1f5f9; }
      p { font-size: 12px; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }
      .file-btn {
        display: inline-block;
        padding: 12px 24px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.15s;
      }
      .file-btn:hover { background: linear-gradient(135deg, #3b82f6, #2563eb); transform: translateY(-1px); }
      #status { margin-top: 16px; font-size: 13px; min-height: 20px; color: #94a3b8; }
      #status.success { color: #4ade80; font-weight: 600; }
      #status.error { color: #f87171; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Cargar Planilla Excel</h2>
      <p>Seleccioná tu planilla .xlsx con columnas "Nombre" y "Apellido"</p>
      
      <label class="file-btn" for="fileInput">📊 Elegir archivo Excel</label>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" />

      <div id="status"></div>
    </div>
    <script src="file-picker.js"></script>
  </body>
</html>
