<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Zoom Attendance Tracker</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 340px;
        background: #0f1117;
        color: #e2e8f0;
        padding: 16px;
        font-size: 13px;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #1e293b;
      }
      .header img { width: 32px; height: 32px; border-radius: 8px; }
      .header h1 { font-size: 14px; font-weight: 600; color: #f1f5f9; }
      .header p { font-size: 11px; color: #64748b; }

      /* File input */
      .file-label {
        display: block;
        font-size: 11px;
        color: #94a3b8;
        margin-bottom: 6px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .file-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      #csvFileInput, #xlsxFileInput { display: none; }

      /* File button row */
      .file-label {
        display: block;
        font-size: 11px;
        color: #94a3b8;
        margin-bottom: 6px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .file-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .file-btn {
        padding: 7px 12px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 6px;
        color: #94a3b8;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .file-btn:hover { background: #273548; border-color: #4f6b8a; color: #e2e8f0; }
      .file-name {
        color: #64748b;
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .file-name.selected { color: #34d399; }

      /* Main button */
      #processBtn {
        width: 100%;
        padding: 10px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.15s;
        letter-spacing: 0.01em;
      }
      #processBtn:hover { background: linear-gradient(135deg, #3b82f6, #2563eb); transform: translateY(-1px); }
      #processBtn:active { transform: translateY(0); }

      /* Status */
      .status {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12px;
        min-height: 34px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status.loading { background: #1e293b; color: #94a3b8; }
      .status.success { background: #052e16; color: #4ade80; border: 1px solid #166534; }
      .status.warning { background: #2d1b00; color: #f59e0b; border: 1px solid #78350f; }
      .status.error   { background: #2d0f0f; color: #f87171; border: 1px solid #7f1d1d; }

      /* Summary bar */
      #summary {
        margin-top: 10px;
        font-size: 11px;
        color: #64748b;
        text-align: center;
      }

      /* Results table */
      #resultSection {
        display: none;
        margin-top: 10px;
      }
      .table-wrap {
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #1e293b;
        border-radius: 6px;
      }
      .table-wrap::-webkit-scrollbar { width: 4px; }
      .table-wrap::-webkit-scrollbar-track { background: #0f1117; }
      .table-wrap::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

      table { width: 100%; border-collapse: collapse; }
      th {
        padding: 6px 8px;
        text-align: left;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #475569;
        background: #0d1421;
        position: sticky;
        top: 0;
      }
      td { padding: 5px 8px; border-top: 1px solid #1a2433; }
      tr:hover td { background: #141c2b; }
      td.nombre { color: #e2e8f0; }
      td.presente { color: #4ade80; }
      td.ausente  { color: #f87171; }
      td.cam-on   { color: #34d399; }
      td.cam-off  { color: #64748b; }

      /* Download button */
      #downloadBtn {
        display: none;
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        background: #052e16;
        color: #4ade80;
        border: 1px solid #166534;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.15s;
      }
      #downloadBtn:hover { background: #064e1d; }

      /* Divider */
      .divider {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 14px 0 10px;
        color: #334155;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .divider::before, .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #1e293b;
      }

      /* Excel section */
      #excelSection { margin-top: 0; }

      /* Excel mark button */
      #markExcelBtn {
        display: none;
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        background: linear-gradient(135deg, #064e3b, #065f46);
        color: #6ee7b7;
        border: 1px solid #047857;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.15s;
      }
      #markExcelBtn:hover { background: linear-gradient(135deg, #065f46, #047857); }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="icons/icon48.png" alt="Logo" />
      <div>
        <h1>Zoom Attendance Tracker</h1>
        <p>Asistencia automática en reuniones de Zoom</p>
      </div>
    </div>

    <label class="file-label">Planilla de asistencia (.xlsx)</label>
    <div class="file-row">
      <button class="file-btn" id="pickFileBtn">📊 Elegir Excel</button>
      <span class="file-name" id="xlsxFileName">Ningún archivo seleccionado</span>
    </div>

    <button id="processBtn">⚡ Escanear y procesar asistencia</button>

    <div id="status" class="status loading" style="display:none;"></div>
    <div id="summary"></div>

    <div id="resultSection">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Alumno</th>
              <th>Asistencia</th>
              <th>Cámara</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </div>

    <button id="downloadBtn">⬇ Descargar reporte CSV</button>

    <div id="excelSection">
      <button id="markExcelBtn">📝 Marcar asistencia en Excel</button>
    </div>

    <script src="xlsx.mini.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
