<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: Arial, sans-serif;
        width: 250px;
        padding: 15px;
      }
      h3 {
        margin-top: 0;
        color: #2d8cff;
      }
      input[type="file"] {
        margin-bottom: 15px;
        width: 100%;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #2d8cff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #1a6bcf;
      }
      #status {
        margin-top: 15px;
        font-size: 13px;
        color: #555;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h3>Tomar Asistencia</h3>

    <label for="csvFileInput" style="font-size: 12px; font-weight: bold"
      >Cargar lista de alumnos (CSV):</label
    >
    <input type="file" id="csvFileInput" accept=".csv" />

    <button id="processBtn">Escanear Zoom y Procesar</button>

    <div id="status">Esperando acción...</div>

    <script src="popup.js"></script>
  </body>
</html>
